<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片 / 视频链接预览</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="3" stroke="#fff" stroke-width="1.8"/>
          <circle cx="8.5" cy="9.5" r="1.8" fill="#fff"/>
          <path d="M4 17l5-5 4 4 3-3 4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="titles">
        <h1>图片 / 视频 / 音频链接预览</h1>
        <p>预览 · 本地转文字 · MD5 · 去重 · 不保存到本地</p>
      </div>
      <div class="top-actions">
        <span><kbd>⌘</kbd><kbd>V</kbd> 粘贴 &nbsp;·&nbsp; <kbd>⌘</kbd><kbd>⇧</kbd><kbd>Y</kbd> 打开</span>
      </div>
    </div>
  </header>

  <main>
    <section class="input-panel">
      <textarea id="input" spellcheck="false" autofocus
        placeholder="在这里粘贴图片 / 视频 / 音频链接，支持一次粘贴多行或一整段包含链接的文字，例如：&#10;https://cdn.example.com/.../a.jpg&#10;https://cdn.example.com/.../b.mp4"></textarea>
      <div class="input-row">
        <button id="preview" class="primary" type="button">预览</button>
        <button id="paste" type="button">读取剪贴板</button>
        <button id="clear" type="button">清空</button>
        <button id="text-tools-btn" type="button" title="多行文本快速去重">文本处理</button>
        <button id="batch-transcribe" type="button" title="批量转写当前列表里的所有音频">批量转文字</button>
        <button id="export-transcripts" type="button" title="导出当前列表的转写文字为 CSV" hidden>导出文字</button>
        <label class="parallel-control" title="同时运行的本地识别任务数；每个任务使用 4 个线程，并行越高越快，但更吃 CPU/内存">
          并行
          <select id="transcribe-parallel">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <button id="export-md5" type="button" title="计算当前列表所有链接的 MD5 并下载 CSV">导出 MD5</button>
        <span class="shortcut"><kbd>⌘</kbd><kbd>↵</kbd> 预览</span>
        <span id="status" class="status" role="status"></span>
      </div>
    </section>

    <section id="gallery" class="gallery" aria-label="图片预览" hidden></section>

    <section id="empty" class="empty">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="4" width="19" height="16" rx="3" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="8.2" cy="9.2" r="1.7" fill="currentColor"/>
        <path d="M3.5 17.2l5.2-5 4 3.9 3-2.9 4.8 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>粘贴链接，直接预览</h2>
      <p>支持图片 / 视频 / 音频直链，多个链接可一次粘贴</p>
    </section>
  </main>

  <div id="text-tools" class="modal" role="dialog" aria-modal="true" aria-labelledby="tt-title" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="tt-title">文本处理</h2>
        <span class="tt-sub">多行文本去重</span>
        <button id="tt-close" class="modal-close" type="button">关闭</button>
      </div>
      <div class="tt-body">
        <div class="tt-column">
          <label class="tt-label" for="tt-input">原始文本（每行一条）</label>
          <textarea id="tt-input" spellcheck="false" placeholder="粘贴多行文本，例如多个链接，每行一个…"></textarea>
        </div>
        <div class="tt-column">
          <label class="tt-label" for="tt-output">去重结果</label>
          <textarea id="tt-output" spellcheck="false" readonly placeholder="点击「去重」在这里查看结果"></textarea>
        </div>
      </div>
      <div class="tt-options">
        <label><input type="checkbox" id="tt-trim" checked> 忽略行首尾空格</label>
        <label><input type="checkbox" id="tt-drop-empty" checked> 去除空行</label>
        <label><input type="checkbox" id="tt-ignore-case"> 忽略大小写</label>
        <label>排序
          <select id="tt-sort">
            <option value="none">保留原顺序</option>
            <option value="asc">升序</option>
            <option value="desc">降序</option>
          </select>
        </label>
        <span class="tt-hint"><kbd>⌘</kbd><kbd>↵</kbd> 去重</span>
      </div>
      <div class="tt-actions">
        <button id="tt-run" class="primary" type="button">去重</button>
        <button id="tt-copy" type="button">复制结果</button>
        <button id="tt-apply" type="button">替换到链接列表</button>
        <button id="tt-load" type="button">载入当前链接列表</button>
        <span id="tt-stats" class="tt-stats" role="status"></span>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-bar">
      <span id="lb-counter" class="lb-counter"></span>
      <span id="lb-url" class="lb-url"></span>
      <button id="lb-copy" type="button">复制链接</button>
      <button id="lb-copy-md5" type="button">复制 MD5</button>
      <button id="lb-close" type="button">关闭</button>
    </div>
    <div class="lb-stage">
      <button id="lb-prev" class="lb-nav lb-prev" type="button" aria-label="上一个">‹</button>
      <img id="lb-img" alt="">
      <video id="lb-video" controls playsinline hidden></video>
      <div id="lb-audio-wrap" class="lb-audio" hidden>
        <div class="lb-audio-icon" aria-hidden="true">♫</div>
        <div id="lb-audio-name" class="lb-audio-name"></div>
        <audio id="lb-audio" controls></audio>
        <div class="lb-transcript-tools">
          <button id="lb-transcribe" type="button">转文字</button>
          <button id="lb-copy-transcript" type="button" hidden>复制文字</button>
          <span id="lb-transcript-status" class="transcript-status" role="status"></span>
        </div>
        <div id="lb-transcript" class="lb-transcript" hidden></div>
      </div>
      <button id="lb-next" class="lb-nav lb-next" type="button" aria-label="下一个">›</button>
    </div>
    <div class="lb-hint">← → 切换 · Esc 关闭</div>
  </div>

  <script src="viewer.js" defer></script>
</body>
</html>
